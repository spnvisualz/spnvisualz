name: Build and deploy site

# Replaces the previous manual flow (build on a Mac, rsync dist/ into a
# clone, push the built output to main). main is now the source of truth
# and GitHub Pages serves the artifact this workflow produces, so the
# published site always corresponds to a known commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight
# run rather than cancelling a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Original master media is stored via Git LFS. The site itself
          # only needs the committed optimized web assets, so skip LFS
          # blobs here — it keeps checkout fast and avoids spending LFS
          # bandwidth on every deploy.
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        # Bug-finding rules only (eslint:recommended), no style enforcement,
        # so this flags things that fail at runtime rather than reformatting
        # hand-written code. Warnings do not fail the run; errors do.
        run: npm run lint

      - name: Tests
        # tests/intro.test.mjs existed and passed but nothing ran it, so a
        # regression in the arrival sequence could reach main unnoticed.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # Pages that must exist for the site to be whole.
          for page in \
            index.html \
            about/index.html \
            privacy/index.html \
            terms/index.html \
            websites/index.html \
            work/index.html \
            visual-lab/index.html \
            visual-lab/author/chubae/index.html \
            visual-lab/articles/how-to-make-a-brand-look-expensive/index.html
          do
            [ -s "dist/$page" ] || fail "missing or empty: dist/$page"
          done

          # Files that keep the domain and its search presence working.
          for f in CNAME robots.txt sitemap.xml ads.txt favicon.ico; do
            [ -s "dist/$f" ] || fail "missing or empty: dist/$f"
          done

          # The authoring scaffold is full of unresolved {{PLACEHOLDER}}
          # tokens and must never be published.
          [ -e dist/visual-lab/article-template.html ] && fail "article-template.html must not be published"

          # Every homepage section must survive a build. An earlier edit to
          # the Selected Work markup anchored on the last "</article>" in
          # the document — which belongs to a pricing card — and silently
          # deleted the whole Services and Pricing sections. Nothing caught
          # it until it was live.
          for chapter in origin manifesto work services pricing process lab contact; do
            grep -q "data-chapter=\"$chapter\"" dist/index.html || fail "homepage section missing: $chapter"
          done

          # Counts, so a section cannot survive as an empty shell.
          check_count () {
            local pattern="$1" expected="$2" label="$3"
            local n; n=$(grep -c "$pattern" dist/index.html || true)
            [ "$n" -ge "$expected" ] || fail "$label: expected at least $expected, found $n"
          }
          check_count 'service-row'  6 "service rows"
          check_count 'price-row'    4 "pricing rows"
          check_count 'bundle-card'  3 "pricing bundles"
          check_count 'data-order'   4 "order buttons"

          # Selected Work is the portfolio; an empty container means the
          # markup regressed to being JS-generated.
          # Count comes from src/work/projects.js so the guard follows the
          # portfolio instead of pinning a number that has to be chased by
          # hand every time a project is added or removed.
          expected=$(grep -c 'slug:' src/work/projects.js)
          items=$(grep -c 'class="work-item"' dist/index.html || true)
          [ "$items" -eq "$expected" ] || fail "expected $expected work items in dist/index.html, found $items"
          [ "$items" -ge 5 ] || fail "only $items work items — the portfolio looks truncated"

          # Every referenced work video must actually be present.
          missing=0
          for v in $(grep -ohE '/assets/videos/work/[a-z0-9.-]+\.mp4' dist/index.html dist/assets/*.js 2>/dev/null | sort -u); do
            [ -s "dist$v" ] || { echo "::error::missing video: $v"; missing=1; }
          done
          [ "$missing" -eq 0 ] || fail "one or more referenced videos are missing from the build"

          # Advertising policy: no AdSense library tag may be hard-coded in
          # markup. ads.js requests it only after a certified CMP grants
          # consent and a real numeric slot exists.
          if grep -rl "pagead2.googlesyndication.com" dist --include='*.html' | grep -q .; then
            grep -rn "pagead2.googlesyndication.com" dist --include='*.html' | head
            fail "AdSense library tag found in published HTML"
          fi

          # Empty ad placeholders are an AdSense policy problem.
          if grep -rl "Partner space" dist | grep -q .; then
            fail "empty ad placeholder text found in build"
          fi

          echo "Build verified: $(find dist -name '*.html' | wc -l) HTML pages, $(du -sh dist | cut -f1) total"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    # The checkout API (worker/index.js) on spnvisualz.com/api/*. Runs only
    # after lint and tests pass, and only once the CLOUDFLARE_API_TOKEN
    # repository secret exists (token template "Edit Cloudflare Workers",
    # limited to this account and the spnvisualz.com zone). Stripe keys stay
    # as Worker secrets in Cloudflare; this job never sees them.
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the Worker was not redeployed. Deploy manually with npm run deploy:cloudflare."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          lfs: false

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

  verify-production:
    needs: [deploy, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        run: |
          set -euo pipefail
          base=https://spnvisualz.com

          # Pages can take a moment to serve the new deployment.
          sleep 20

          fail=0
          for path in "/" "/about/" "/privacy/" "/terms/" "/websites/" "/work/" \
                      "/visual-lab/" "/visual-lab/author/chubae/" \
                      "/sitemap.xml" "/ads.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base$path")
            printf '%-42s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # The authoring scaffold must not be reachable.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/visual-lab/article-template.html")
          printf '%-42s %s (expect 404)\n' "/visual-lab/article-template.html" "$code"
          [ "$code" = "404" ] || fail=1

          # No ad library on the live homepage.
          if curl -s "$base/" | grep -q "pagead2.googlesyndication.com"; then
            echo "::error::AdSense library tag present on live homepage"
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "::error::production verification failed"; exit 1; }
          echo "Production verified."

      - name: Check the store API route
        # The basket posts to /api/* on the site's own domain, which only
        # works if that path reaches the Cloudflare Worker (route declared
        # in wrangler.jsonc). A bare GET must get the Worker's JSON 400;
        # GitHub Pages would answer 404 HTML, meaning checkout is broken.
        run: |
          set -uo pipefail
          base=https://spnvisualz.com
          echo "A records:  $(dig +short A spnvisualz.com | tr '\n' ' ')"
          echo "NS records: $(dig +short NS spnvisualz.com | tr '\n' ' ')"
          echo "www CNAME:  $(dig +short CNAME www.spnvisualz.com | tr '\n' ' ')"
          for path in /api/checkout-session /checkout.html /thank-you.html; do
            out=$(curl -s -o /tmp/body -w '%{http_code} %{content_type}' "$base$path")
            server=$(curl -sI "$base$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="server"{print $2}')
            printf '%-26s %s  server=%s  %s\n' "$path" "$out" "$server" "$(head -c 120 /tmp/body | tr '\n' ' ')"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/checkout-session")
          case "$code" in
            400|405) echo "Worker answers /api/* on $base." ;;
            *) echo "::error::$base/api/checkout-session returned $code; the basket cannot open Stripe Checkout until /api/* reaches the Worker."; exit 1 ;;
          esac
