<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SPNVISUALZ responsive QA</title>
  <style>
    *{box-sizing:border-box}
    html{background:#17131e;color:#fff;font:12px/1.4 Arial,sans-serif}
    body{margin:0;padding:20px;display:flex;align-items:flex-start;gap:20px;min-width:max-content}
    figure{margin:0;display:grid;gap:8px}
    figcaption{color:#c6a7ff;letter-spacing:.08em;text-transform:uppercase}
    iframe{display:block;border:1px solid #4b3b63;background:#030207}
  </style>
</head>
<body>
  <figure>
    <figcaption>390 × 844</figcaption>
    <iframe id="phone390" title="SPNVISUALZ at 390 pixels" src="/?qa=phone390" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>430 × 932</figcaption>
    <iframe id="phone430" title="SPNVISUALZ at 430 pixels" src="/?qa=phone430" width="430" height="932"></iframe>
  </figure>
</body>
</html>
